<div class="border border-secondary border-opacity-25 rounded-3 d-flex align-items-center justify-content-between p-3 mb-2 shadow-sm" style="background-color: #1a2230 !important;">
  <div>
    <h6 class="text-white fw-bold mb-1">{{ um.template.title }}</h6>
    <span class="text-purple fw-bold small">Progreso: ({{ um.progress }}/{{ um.template.target_count }})</span>
  </div>
  
  <div class="d-flex align-items-center gap-3">
    <!-- Botón de Info [ i ] -->
    <button class="btn btn-sm text-white rounded-2 px-2 py-1 shadow-sm" style="background: linear-gradient(180deg, #a885e8 0%, #6f42c1 100%); border: 1px solid #fff;"
      data-bs-toggle="modal" data-bs-target="#infoModal" 
      onclick="showInfo('{{ um.template.title|escapejs }}', '{{ um.template.description|escapejs }}')">
      <i class="bi bi-info-lg fs-5 fw-bold"></i>
    </button>
    
    <!-- Caja de Recompensa -->
    <div class="text-center p-2 reward-box 
      {% if um.is_claimed %}claimed{% elif um.is_completed %}glow-purple{% endif %}" 
      style="width: 75px;"
      {% if um.is_completed and not um.is_claimed %}onclick="claimReward({{ um.id }}, this)"{% endif %}>
      
      {% if um.is_completed and not um.is_claimed %}
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
      {% endif %}
      
      <i class="bi bi-gem fs-3 text-purple drop-shadow"></i>
      <span class="d-block small text-white fw-bold">{{ um.template.reward_amount }} SC</span>
    </div>
  </div>
</div>
